<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de planes de estudio</title>
    <link rel="icon" href="WhatsApp Image 2026-07-17 at 16.00.58.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <canvas id="ferrofluid-canvas"></canvas>
    <div class="app-shell">
        <div class="page-card">
    <div class="header">
        <h1>Menú de planes</h1>
        <p>Selecciona un plan guardado o crea uno nuevo para cualquier materia.</p>
        <div class="user-meta">
            <span>Sesión: <strong id="user-name"></strong></span>
            <span id="user-email"></span>
            <button id="logout-btn" type="button" class="secondary btn-with-icon"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
        </div>
    </div>

    <div class="plans-menu">
        <div class="plans-menu-header">
            <div>
                <h2>Planes guardados</h2>
                <p>Abre un plan existente o crea uno nuevo desde esta página.</p>
            </div>
            <a href="plan-create.html?new=1" class="primary btn-with-icon"><i class="bi bi-plus-circle"></i> Crear nuevo plan</a>
        </div>
        <div id="saved-plans-list" class="saved-plans-list"></div>
    </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="db-utils.js"></script>
    <script src="ferrofluid-bg.js"></script>
    <script>
        const activeUserKey = 'studyPlannerUser';
        const currentUser = requireUser();
        const savedPlansList = document.getElementById('saved-plans-list');

        function getCurrentUser() {
            const saved = localStorage.getItem(activeUserKey);
            if (!saved) return null;
            try {
                const parsed = JSON.parse(saved);
                if (parsed && parsed.email && parsed.name) return parsed;
            } catch (error) {
                console.error('Error leyendo el usuario activo:', error);
            }
            return null;
        }

        function requireUser() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'plan-login.html';
                return null;
            }
            return user;
        }

        function logout() {
            localStorage.removeItem(activeUserKey);
            window.location.href = 'plan-login.html';
        }

        function renderUserInfo() {
            document.getElementById('user-name').textContent = currentUser.name;
            document.getElementById('user-email').textContent = currentUser.email;
        }

        async function renderPlans() {
            const plans = await loadPlansForUser(currentUser.email);
            savedPlansList.innerHTML = '';

            if (!plans.length) {
                savedPlansList.innerHTML = '<p class="empty-menu">No hay planes guardados todavía.</p>';
                return;
            }

            plans.forEach(plan => {
                const item = document.createElement('div');
                item.className = 'saved-plans-item';

                const title = document.createElement('strong');
                title.textContent = plan.title || 'Plan sin título';

                const description = document.createElement('p');
                description.textContent = plan.description || 'Sin descripción';

                const actions = document.createElement('div');
                actions.className = 'saved-plans-actions';

                const openButton = document.createElement('a');
                openButton.href = `plan-view.html?planId=${encodeURIComponent(plan.plan_id)}`;
                openButton.className = 'editor-small-btn primary btn-with-icon';
                openButton.innerHTML = '<i class="bi bi-box-arrow-up-right"></i> Abrir';

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'editor-small-btn danger btn-with-icon';
                deleteButton.innerHTML = '<i class="bi bi-trash"></i> Eliminar';
                deleteButton.addEventListener('click', () => deleteSavedPlan(plan.plan_id));

                actions.appendChild(openButton);
                actions.appendChild(deleteButton);

                item.appendChild(title);
                item.appendChild(description);
                item.appendChild(actions);
                savedPlansList.appendChild(item);
            });
        }

        async function deleteSavedPlan(planId) {
            if (!confirm('¿Eliminar este plan guardado?')) return;
            await deletePlanForUser(currentUser.email, planId);
            renderPlans();
        }

        document.getElementById('logout-btn').addEventListener('click', logout);
        renderUserInfo();
        renderPlans();
    </script>
</body>
</html>
