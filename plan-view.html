<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver plan de estudio</title>
    <link rel="icon" href="WhatsApp Image 2026-07-17 at 16.00.58.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <canvas id="ferrofluid-canvas"></canvas>
    <div class="app-shell">
        <div class="page-card">
    <div class="header">
        <h1 id="page-title">Ver plan</h1>
        <p id="page-desc">Revisa el plan guardado y marca las tareas completadas.</p>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">0%</div>
        </div>
        <p id="progress-text">0 de 0 tareas completadas</p>
    </div>

    <div class="top-menu-link">
        <p>Ir al menú de planes o crear uno nuevo.</p>
        <div class="view-links-row">
            <a href="plan-menu.html" class="primary btn-with-icon"><i class="bi bi-list-ul"></i> Menú de planes</a>
            <a id="edit-plan-link" href="#" class="secondary btn-with-icon" style="display:none;"><i class="bi bi-pencil"></i> Editar plan</a>
            <a href="plan-create.html?new=1" class="secondary btn-with-icon"><i class="bi bi-plus-circle"></i> Crear plan</a>
        </div>
    </div>

    <div id="plan-container"></div>

    <button class="reset btn-with-icon" onclick="resetProgress()"><i class="bi bi-arrow-repeat"></i> Reiniciar todo mi progreso</button>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="db-utils.js"></script>
    <script src="ferrofluid-bg.js"></script>
    <script>
        const activeUserKey = 'studyPlannerUser';
        const currentUser = requireUser();
        const defaultPlanData = {
            id: 'default-plan',
            title: 'Plan no encontrado',
            description: 'Abre un plan desde el menú o crea uno nuevo.',
            plan: []
        };

        function getCurrentUser() {
            const saved = localStorage.getItem(activeUserKey);
            if (!saved) return null;
            try {
                const parsed = JSON.parse(saved);
                if (parsed && parsed.email && parsed.name) return parsed;
            } catch (error) {
                console.error('Error leyendo el usuario activo:', error);
            }
            return null;
        }

        function requireUser() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return null;
            }
            return user;
        }

        function logout() {
            localStorage.removeItem(activeUserKey);
            window.location.href = 'index.html';
        }

        let planData = null;
        let totalTasks = 0;

        const container = document.getElementById('plan-container');
        const editPlanLink = document.getElementById('edit-plan-link');

        function updateEditLink() {
            if (planData && planData.id && planData.id !== 'default-plan') {
                editPlanLink.href = `plan-create.html?planId=${encodeURIComponent(planData.id)}`;
                editPlanLink.style.display = 'inline-flex';
            } else {
                editPlanLink.style.display = 'none';
            }
        }

        async function loadPlanData() {
            const urlParams = new URLSearchParams(window.location.search);
            const planId = urlParams.get('planId');
            if (planId) {
                const savedPlan = await getPlanById(currentUser.email, planId);
                if (savedPlan) {
                    return {
                        id: savedPlan.plan_id,
                        title: savedPlan.title,
                        description: savedPlan.description,
                        plan: savedPlan.content?.plan || []
                    };
                }
            }
            return JSON.parse(JSON.stringify(defaultPlanData));
        }

        function normalizeDateValue(dateValue) {
            if (!dateValue) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) return dateValue;
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateValue)) {
                const [day, month, year] = dateValue.split('/');
                return `${year}-${month}-${day}`;
            }
            return '';
        }

        function formatDateForDisplay(dateValue) {
            if (!dateValue) return '';
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                const [year, month, day] = dateValue.split('-');
                return `${day}/${month}/${year}`;
            }
            return dateValue;
        }

        async function renderPlan(plan) {
            document.querySelector('.header h1').textContent = planData?.title || 'Ver plan';
            document.querySelector('.header p').textContent = planData?.description || 'Revisa las tareas del plan guardado.';
            const progressMap = planData?.id ? await getTaskProgressForPlan(currentUser.email, planData.id) : {};
            container.innerHTML = '';
            totalTasks = 0;

            plan.forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';

                const title = document.createElement('h3');
                title.textContent = day.day;
                card.appendChild(title);

                if (day.date) {
                    const dateText = document.createElement('p');
                    dateText.className = 'day-date';
                    dateText.textContent = formatDateForDisplay(normalizeDateValue(day.date));
                    card.appendChild(dateText);
                }

                if (day.pdfLink) {
                    const pdfLink = document.createElement('a');
                    pdfLink.href = day.pdfLink;
                    pdfLink.target = '_blank';
                    pdfLink.rel = 'noopener noreferrer';
                    pdfLink.className = 'pdf-link';
                    pdfLink.innerHTML = '<i class="bi bi-file-earmark-pdf me-2"></i>Ver material PDF';
                    card.appendChild(pdfLink);
                }

                day.tasks.forEach(task => {
                    totalTasks++;
                    const taskDiv = document.createElement('div');
                    taskDiv.className = 'task';
                    taskDiv.id = 'div-' + task.id;

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = task.id;
                    if (progressMap[task.id]) {
                        checkbox.checked = true;
                        taskDiv.classList.add('completed');
                    }

                    checkbox.addEventListener('change', async (e) => {
                        if (planData && planData.id) {
                            await setTaskCompletion(currentUser.email, planData.id, task.id, e.target.checked);
                        }
                        if (e.target.checked) {
                            taskDiv.classList.add('completed');
                        } else {
                            taskDiv.classList.remove('completed');
                        }
                        updateProgress();
                    });

                    const label = document.createElement('label');
                    label.htmlFor = task.id;
                    label.textContent = task.text;

                    taskDiv.appendChild(checkbox);
                    taskDiv.appendChild(label);
                    card.appendChild(taskDiv);
                });

                container.appendChild(card);
            });

            updateProgress();
        }

        function updateProgress() {
            let completed = 0;
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => {
                if (cb.checked) completed++;
            });

            const percentage = totalTasks === 0 ? 0 : Math.round((completed / totalTasks) * 100);
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';
            document.getElementById('progress-text').textContent = `${completed} de ${totalTasks} tareas completadas`;
        }

        async function resetProgress() {
            if (!planData || !planData.id) return;
            if (confirm('¿Estás seguro de que quieres borrar todo tu progreso?')) {
                await clearTaskProgressForPlan(currentUser.email, planData.id);
                window.location.reload();
            }
        }

        async function init() {
            planData = await loadPlanData();
            updateEditLink();
            await renderPlan(planData.plan);
        }

        init();
    </script>
</body>
</html>
