<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404</title>
    <link rel="icon" href="WhatsApp Image 2026-07-17 at 16.00.58.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <canvas id="ferrofluid-canvas"></canvas>

    <div class="app-shell">
        <div class="page-card error-card">
            <div class="header error-header">
                <p class="error-eyebrow">Oops...</p>
                <h1>404</h1>
                <p>La página que buscás no existe o fue movida.</p>
            </div>

            <div class="error-content">
                <div class="error-code-wrap">
                    <span class="error-code">404</span>
                </div>

                <div class="error-copy">
                    <h2>No encontramos ese camino</h2>
                    <p>Puede que el enlace esté roto, que la dirección haya cambiado o que el plan ya no esté disponible.</p>
                </div>

                <div class="error-actions">
                    <a href="index.html" class="primary btn-with-icon">
                        <i class="bi bi-house-door"></i> Volver al inicio
                    </a>
                    <a href="plan-menu.html" class="secondary btn-with-icon">
                        <i class="bi bi-list-check"></i> Ir al menú
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="ferrofluid-bg.js"></script>
</body>
</html>
